title: ServicePage
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: service_page_title
            field:
              type: text
              display: 'Service Page Title'
          -
            handle: service_page_description
            field:
              type: textarea
              display: 'Service Page Description'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
