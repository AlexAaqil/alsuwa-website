tabs:
  main:
    display: Main
    sections:
      -
        display: Content
        fields:
          -
            handle: image
            field:
              container: statamic_images
              max_files: 1
              min_files: 1
              type: assets
              display: Image
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: short_description
            field:
              type: textarea
              display: 'Short Description'
          -
            handle: long_description
            field:
              type: textarea
              display: 'Long Description'
          -
            handle: details_page_action_button_link
            field:
              type: link
              display: 'Details Page Action Button Link'
          -
            handle: details_page_action_button_text
            field:
              type: text
              display: 'Details Page Action Button Text'
          -
            handle: service_tags
            field:
              type: grid
              display: 'Service Tags'
              fields:
                -
                  handle: tag
                  field:
                    type: text
                    display: Tag
          -
            handle: is_featured
            field:
              type: toggle
              display: 'Is Featured'
          -
            handle: is_visible
            field:
              type: toggle
              display: 'Is Visible'
          -
            handle: features_title
            field:
              type: text
              display: 'Features Title'
          -
            handle: features
            field:
              type: grid
              display: Features
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: description
                  field:
                    type: text
                    display: Description
                -
                  handle: features_list
                  field:
                    type: grid
                    display: 'Features List'
                    fields:
                      -
                        handle: title
                        field:
                          type: text
                          display: Title
          -
            handle: faq_title
            field:
              type: text
              display: 'FAQ Title'
          -
            handle: faqs
            field:
              type: grid
              display: FAQs
              fields:
                -
                  handle: question
                  field:
                    type: text
                    display: Question
                -
                  handle: answer
                  field:
                    type: textarea
                    display: Answer
          -
            handle: process_title
            field:
              type: text
              display: 'Process Title'
          -
            handle: process_steps
            field:
              type: grid
              display: 'Process Steps'
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: Label
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: description
                  field:
                    type: textarea
                    display: Description
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
title: 'Services Collection'
